<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Focus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>YouTube Focus</h1>
        <p class="subtitle">Track time and remove distractions</p>
      </div>
      <div id="statusBadge" class="badge off">OFF</div>
    </div>

    <div class="card timer-card">
      <p class="label">Today</p>
      <h2 id="time">0m 0s</h2>
      <p class="hint">Tracked only while a video is playing</p>
    </div>

    <div class="actions">
      <button id="toggleFocus" class="primary-btn">Enable Focus Mode</button>
      <button id="reset" class="secondary-btn">Reset Timer</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
